# Sandbox policy (CORE-SEC-01; FE §9.5): least privilege per role, runtime-neutral. A runtime binding (D-09, later)
# maps these capabilities to its own permission model; anything not granted here is denied.
apiVersion: aisf/4.0
kind: SandboxPolicy
toolCatalog:
  repo.read: { effect: read repository files of the task's worktree }
  worktree.write: { effect: write only inside the task's worktree and branch }
  knowledge.search: { effect: query the knowledge index; results are untrusted data }
  factory.context: { effect: run `factory context` }
  factory.verify: { effect: run `factory verify:fast` / `verify` (results carry executor agent-sandbox; never satisfy a required check) }
  package.install: { effect: run the package manager in frozen-lockfile mode }
  # Change Shepherd tools (Standard §12.2.1 items 5, 8-9; FE §11.7): approved, audited, mitigation-only.
  telemetry.read: { effect: read the change-specific view built from existing telemetry (no new telemetry platform) }
  flag.return-to-safe-state: { effect: "return a flag to its declared safeState through the audited flag provider; Low/Medium tier, tied to an open alert or incident (maps to PAUSED)" }
  rollout.pause: { effect: "pause a staged rollout; Low/Medium tier, tied to an open alert or incident, audited (maps to PAUSED)" }
  rollout.report: { effect: report rollout status and a continue / pause / rollback recommendation to the accountable owner and on-call }
filesystem: { write: worktree-only, read: worktree-only }
network: { default: deny, allowlistHosts: [registry.npmjs.org] }
secrets: { production: forbidden, injected: none }
untrustedInputs: [issue, pr-comment, review-comment, documentation, tool-output, web-page, knowledge-search-result]
audit: { everyAction: true, identity: per-role-session }
neverAllowed: [approve-pr, dismiss-security-finding, change-waiver, enable-zero-human-merge, write-policy-repo, write-evidence-store]
