# Task classes (FE §7.1; Standard §9.4): one ACTIVE playbook id@major, one scope, one ceiling sub-tier.
# Trust earned in one class never transfers to another. Pilot cost defaults per FE §9.3.
apiVersion: aisf/4.0
kind: TaskClassRegistry
taskClasses:
  - { id: bug-fix, playbook: bug-fix@1, scope: { repositories: [acme-frontend] }, ceiling: R2, budgets: { cost: { limit: 20, unit: usd } } }
  - { id: docs.link-fix, playbook: docs-update@1, scope: { repositories: [acme-frontend], paths: ["docs/**", "**/*.md"] }, ceiling: R0, budgets: { cost: { limit: 5, unit: usd } } }
