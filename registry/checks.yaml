# Check Registry (Standard §8.7; FE §8.2). Central check definitions (CORE-VER-05): a product PR cannot modify them.
# `mode` selects the enforcement in effect: pilot = Standard §20.8 (sensors at warn except skip-focus,
# control-file-change and oracle-lock); `targetEnforcement` is the Standard §7.13 target, the L2 minimum.
# quality.* checks run through tool adapters (registry/adapters.yaml) with configs generated from the pinned kit;
# no check executes a script defined by the repo under verification (DV-05). Every active check carries fixtures
# (or a proof test) that test/registry-proof.test.mjs runs: the mutation proof of FE §8.2 rule 1.
apiVersion: aisf/4.0
kind: CheckRegistry
mode: pilot
checks:
  - checkId: quality.lint
    checkVersion: 1.0.0
    owner: team-platform
    lifecycle: active
    requirement: required
    enforcement: blocking
    severity: BLOCKER
    gate: merge
    implementsRules: [FE-ARCH-001, FE-ARCH-006, FE-DS-001, FE-STATE-002, FE-UX-001]
    baselineable: true
    fpSlo: 0.05
    autoDemote: true
    basis:
      class: profile
      source: FE Blueprint 4.1 §8.4 baseline
    evidenceLayer: static
    adapter: eslint
    timeoutSeconds: 600
    fixtures:
      violating:
        - {"repo": "showcase/fixtures/ts-repo"}
      conforming:
        - {"repo": "showcase/fixtures/ts-repo", "change": "showcase/fixtures/fix-lint.diff"}
  - checkId: quality.typecheck
