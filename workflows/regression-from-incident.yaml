# Regression from incident — elaborates bug-fix (FE §9.2 playbook catalog, §9.10 "Regression tests from bugs and
# incidents", §11.5; sub-states FE §18.2). PROPOSED: the workflow owner must approve it before it becomes ACTIVE;
# an agent never activates its own playbook. It keeps every step, mandatory checkpoint, handoff and budget of
# bug-fix@1 (Standard §6.7.1 rule 3: a workflow does not loosen) and adds:
#   - scenario-approval: the reproduction is attached to a journey scenario and AC; a new scenario is approved by the
#     journey owner before it becomes the locked oracle (FE §9.10 regression item 2; profile-added checkpoint,
#     Standard §20 PC table "add steps, checkpoints").
#   - attach-scenario and eval-candidate steps (FE §9.10 regression items 2 and 4).
# The reproduction test must fail on the faulty commit (FE §9.10 regression item 1). An oracle change request
# returns the task to PLANNED; only the AC approver decides (FE §9.10 oracle protection item 3).
apiVersion: aisf/4.0
kind: TaskWorkflowSpec
metadata: { id: regression-from-incident, version: 1.0.0, owner: team-platform, status: PROPOSED }
spec:
  taskClasses: [regression-from-incident]
  riskCeiling: Medium            # pilot: R1/R2 (FE §20.2), as bug-fix
  trigger: ["incident or bug report with a postmortem reference and a factory task command"]
  inputs: { required: [goal, why, repository, reproductionReference, incidentReference, faultyCommit], optional: [suspectedArea, journeyId] }
  preconditions: ["repository has golden commands and a resolved verification profile", "no unresolved knowledge conflict blocks the affected area", "the affected journey exists in journeys.yaml"]
  subStates: { CONTEXT_READY: [REPRODUCING, REPRODUCED], PLANNED: [SCENARIO_APPROVED], EXECUTING: [FIXING] }
  checkpoints:
    - { id: requirement-review, kind: mandatory, after: classify }
    - { id: scenario-approval, kind: mandatory, after: attach-scenario }
    - { id: plan-review, kind: conditional, after: plan, when: "tier == High OR reversibility == LOW" }
    - { id: independent-verification, kind: mandatory, after: verify }
    - { id: implementation-review, kind: mandatory, after: review }
  recoveryDefaults:
    timeout: 30m
    retry: { max: 2, backoff: exponential, on: [ERROR, timeout] }
    idempotent: true
    sideEffect: none
  steps:
    - { id: intake, skeletonStep: 1, kind: mandatory, role: intake, inputs: [goal, why, reproductionReference, incidentReference], outputs: [change-brief], verification: "change-brief fields complete; every AC has an oracle; the reproduction AC is critical (Standard §6.4.1 item 7)", onFailure: NEEDS_CLARIFICATION }
    - { id: classify, skeletonStep: 2, kind: mandatory, role: policy, inputs: [change-brief], outputs: [policy-decision], verification: policy.risk, onFailure: escalate }
    - { id: resolve-context, skeletonStep: 3, kind: mandatory, role: investigator, inputs: [change-brief], outputs: [context-pack, basis], verification: "every basis artifact is ACTIVE", onFailure: NEEDS_CLARIFICATION }
    - { id: reproduce, skeletonStep: 10, kind: mandatory, role: verifier, subState: REPRODUCED, inputs: [change-brief, faulty-commit], outputs: [reproduction-test, oracleRefs], verification: "reproduction test fails on the faulty commit (FE §9.10 regression item 1)", onFailure: NEEDS_CLARIFICATION }
    - { id: attach-scenario, skeletonStep: 4, kind: mandatory, role: verifier, inputs: [reproduction-test, journeys], outputs: [scenario, ac-link], verification: "the test is tagged @journey, @scenario and @ac of an existing or proposed journey scenario (FE §7.7)", onFailure: NEEDS_CLARIFICATION }
    - { id: diagnose, skeletonStep: 5, kind: mandatory, role: investigator, inputs: [reproduction-test, context-pack], outputs: [root-cause], verification: "root cause explains the failing test", onFailure: escalate }
    - { id: plan, skeletonStep: 6, kind: mandatory, role: implementer, subState: SCENARIO_APPROVED, inputs: [root-cause], outputs: [plan], verification: "plan names files, tests and revert", onFailure: escalate }
    - { id: implement, skeletonStep: 8, kind: mandatory, role: implementer, subState: FIXING, inputs: [plan, reproduction-test], outputs: [head-sha], verification: "verify:fast", onFailure: { retry: implement }, sideEffect: reversible, rollback: "reset the work branch" }
    - { id: verify, skeletonStep: 11, kind: mandatory, role: verifier, inputs: [head-sha, oracleRefs], outputs: [verification-run], verification: "verify; oracle hashes unchanged", onFailure: { returnTo: implement } }
    - { id: review, skeletonStep: 12, kind: mandatory, role: reviewer, inputs: [pr, verification-run, locked-acs], outputs: [review-findings], verification: "findings dispositioned", onFailure: { returnTo: implement } }
    - { id: knowledge-reconcile, skeletonStep: 14, kind: mandatory, role: implementer, inputs: [knowledge-impact], outputs: [reconciliation-decisions], verification: knowledge.impact, onFailure: escalate }
    - { id: eval-candidate, skeletonStep: 14, kind: conditional, when: "incident == qualifying", role: verifier, inputs: [reproduction-test, root-cause], outputs: [seeded-defect-candidate, eval-case], verification: "the Agent/Eval engineer decides dev set or hold-out set (FE §9.10 regression item 4)", onFailure: escalate }
    - { id: package, skeletonStep: 15, kind: mandatory, role: implementer, inputs: [verification-run, review-findings], outputs: [pr], verification: "PR template sections complete (Appendix G)", onFailure: escalate, sideEffect: reversible, rollback: "close the PR" }
    - { id: approve-merge, skeletonStep: 16, kind: mandatory, role: human, inputs: [pr, policy-decision], outputs: [merge-approval], verification: policy.sod, onFailure: escalate }
  handoffs:
    - { from: verifier, to: implementer, validIn: [PLANNED], requiredArtifacts: [reproduction-test, oracleRefs, scenario] }
    - { from: implementer, to: verifier, validIn: [VERIFYING], requiredArtifacts: [head-sha], excludeContext: [implementer-notes, reasoning, plan] }
    - { from: implementer, to: reviewer, validIn: [REVIEWING], requiredArtifacts: [pr, verification-run, locked-acs], excludeContext: [implementer-notes, reasoning] }
  maxHandoffRejections: 2
  budgets: { verifyRepairIterations: 3, reviewRounds: 3, mergeQueueAttempts: 2, cost: { limit: 20, unit: usd } }
  completion: { requiredOutputs: [pr, verification-run, merge-approval, scenario] }
  metrics: [lead-time, human-touches, verify-iterations, review-rounds, cost]
