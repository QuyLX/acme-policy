# Synthetic descriptor of the admin app (SC-13 review.ai-mode): the trusted source of the surface's current AI review
# mode (FE §9.9, review.aiMode). The review.ai-mode gate reads it from the repository, never from the request.
apiVersion: aisf/4.0
kind: FactoryConfig
standard: aisf@4.0.0
profile: aisf-frontend@1.1.0
application: admin
owner: team-a
backupOwners: [team-b]
lifecycle: active
platform: { channel: stable }
surfaces:
  - id: admin/users
    owner: team-a
    backupOwner: team-b
    paths: ["apps/admin/src/modules/users/**"]
    rendering: authenticated
    archetypes: [operational]
    criticality: high
    review: { aiMode: advisory, depth: standard }
    autonomy: { zeroHuman: false }
contracts:
  consumes: []
promptAssets: []
autonomy:
  zeroHumanOptIn: []
  aiReviewMode: {}
riskMap:
  - { paths: ["apps/admin/**"], tier: Medium, subTier: R2, reason: "x:privileged-admin floor", source: "FE §10.1" }
